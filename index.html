<style>

  #overBox{width:min(92%,340px);max-height:92%;overflow:auto;background:rgba(23,28,50,.97);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px;color:#fff;box-shadow:0 18px 60px rgba(0,0,0,.45);text-align:center;}
  #overTitle{font-size:26px;font-weight:800;color:#ff7b6b;margin-bottom:4px;}

<script>
"use strict";

/* ============================================================
   职级大作战 · 13级四等休闲合成小游戏
   ruleset_id: suika-v2
   13个等级 → 四大级：正高级1~4 / 副高级5~7 / 中级8~10 / 初级11~13
   球大小：等级品次越高越大（1级最大，13级最小）
   合并：两个同级 l 合成 l-1（更大）；一级球为独立个体，不参与合并
   ============================================================ */
const CFG = {
  ruleset_id:"suika-v2",
  W:440, H:820,
  ceilY:158,
  wallL:46, wallR:394,
  floorY:772,
  G:1050, airFric:1.5, rest:0.22, solveIters:9, maxV:1500,
  mergeDistK:1.12,
  rSmall:21.12, rGrowth:1.15,    // 球体基准半径（在此前基础上再放大10%：19.2→21.12）与成长
  minLevel:13, maxLevel:1,
};

/* ---------- 13级数据（1级最大 → 13级最小） ---------- */
const COLS=["","#7c3aed","#3b82f6","#06b6d4","#14b8a6","#22c55e","#a3e635","#facc15","#fb923c","#f97316","#ef4444","#e11d48","#d946ef","#f472b6"];
const TIERS=[
  {name:"正高级", from:1, to:4,   size:"最大", cls:"t1"},
  {name:"副高级", from:5, to:7,   size:"较大", cls:"t2"},
  {name:"中级",   from:8, to:10,  size:"中等", cls:"t3"},
  {name:"初级",   from:11, to:13, size:"最小", cls:"t4"},
];
function rOf(l){ return CFG.rSmall*Math.pow(CFG.rGrowth, 13-l); }
function pts(newL){ return (14-newL)*(14-newL); }   // 合成到越低级(越大)分越高

/* ---------- 画布与缩放（游戏在左，图例在右） ---------- */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const stage=document.getElementById("stage"), wrap=document.getElementById("wrap");
let scale=1, dpr=1;
let myName="勤劳的园丁", lb=[];    // 排行榜：昵称（默认）与记录数组
let legendVisible = window.innerWidth >= 720;   // 窄屏（手机）默认收起对照表
function layout(){
  dpr=window.devicePixelRatio||1;
  const availW=window.innerWidth-16, availH=window.innerHeight-16;
  const legendW=legendVisible?264:0, gap=legendVisible?14:0;
  let stageW, stageH, side=true;
  stageH=availH; stageW=stageH*CFG.W/CFG.H;
  if(stageW+legendW+gap>availW){ stageW=Math.max(220,availW-legendW-gap); stageH=stageW*CFG.H/CFG.W;
    if(stageH>availH) side=false; }
  if(!side){ const hMax=legendVisible?availH*0.60:availH;
    stageW=Math.min(availW,460); stageH=stageW*CFG.H/CFG.W;
    if(stageH>hMax){ stageH=hMax; stageW=stageH*CFG.W/CFG.H; } }
  wrap.className=side?"side":"stack";
  stage.style.width=stageW+"px"; stage.style.height=stageH+"px";
  scale=stageW/CFG.W;
  cv.width=Math.round(stageW*dpr); cv.height=Math.round(stageH*dpr);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  document.getElementById("legend").style.display=legendVisible?"":"none";
  document.getElementById("legendShow").style.display=legendVisible?"none":"block";
}
window.addEventListener("resize",layout); layout();
document.getElementById("legendHide").addEventListener("click",()=>{ legendVisible=false; layout(); });
document.getElementById("legendShow").addEventListener("click",()=>{ legendVisible=true; layout(); });
document.getElementById("btnDone").addEventListener("click",()=>{ hideWin(); });
document.getElementById("lbBtn").addEventListener("click",openLB);
document.getElementById("lbClose").addEventListener("click",closeLB);
document.getElementById("btnStart").addEventListener("click",()=>{ startGame(); });
document.getElementById("btnLbMenu").addEventListener("click",openLB);
document.getElementById("overAgain").addEventListener("click",()=>{ startGame(); });
document.getElementById("overName").addEventListener("input",onOverNameInput);

/* ---------- 状态 ---------- */
let fruits=[], parts=[], pops=[];
let S={mode:"ready",score:0,best:0};
try{S.best=+localStorage.getItem("suikaBest2")||0;}catch(e){}
let aim={x:CFG.W/2,active:false}, queue=[], keyL=false,keyR=false;
let shake=0, dangerFlash=0;
let advanced=false;      // 职级大作战1.0：合成到4级(正高级)后进入高级阶段，清初级球、掉落5~10级

/* ---------- 音频 ---------- */
let AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC;}
function tone(f0,f1,dur,type,vol){ const a=audio(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);}
const sfxDrop=()=>tone(200,160,.08,"triangle",.12);
const sfxMerge=()=>{tone(520,780,.13,"sine",.2); setTimeout(()=>tone(780,1040,.12,"sine",.16),40);};
const sfxBig=()=>{tone(660,990,.16,"sine",.22); setTimeout(()=>tone(990,1320,.2,"sine",.2),60);};
const sfxOver=()=>{tone(500,180,.6,"sawtooth",.3);};
const sfxWin=()=>{ const a=audio(); if(!a)return; const seq=[523,659,784,1046];
  seq.forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); const t0=a.currentTime+i*0.12;
    o.type="triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+0.55); }); };

/* ---------- 本地排行榜 ---------- */
try{ lb=JSON.parse(localStorage.getItem("suikaLB2")||"[]")||[]; }catch(e){ lb=[]; }
try{ myName=localStorage.getItem("suikaName")||"勤劳的园丁"; }catch(e){ myName="勤劳的园丁"; }
function saveRecord(){
  if(!S.maxLevel || S.saved) return;
  S.saved=true;
  const name=myName||"勤劳的园丁";
  const rec={name, score:S.score, maxLevel:S.maxLevel, drops:S.drops, win:!!S.won, t:Date.now()};
  lb.push(rec);
  sortLB(); lb=lb.slice(0,100);
  S.curRec=rec;
  try{ localStorage.setItem("suikaLB2", JSON.stringify(lb)); }catch(e){}
  const rank=lb.indexOf(rec)+1;
  if(rank>=1&&rank<=10){ showToast("🏆 上榜！本局第 "+rank+" 名"); }
}
function sortLB(){ lb.sort((a,b)=>(a.maxLevel-b.maxLevel)||(b.score-a.score)||(a.drops-b.drops)||(a.t-b.t)); }
function openLB(){ renderLB(); document.getElementById("lbOverlay").classList.add("show"); }
function closeLB(){ document.getElementById("lbOverlay").classList.remove("show"); }
function renderLB(){
  const box=document.getElementById("lbList");
  if(lb.length===0){ box.innerHTML="<div id='lbEmpty'>还没有记录，玩一局试试吧！</div>"; return; }
  const medals=["🥇","🥈","🥉"];
  let html="";
  lb.slice(0,10).forEach((r,i)=>{
    const medal=medals[i]||(i+1);
    html+=`<div class='lb-row'>
      <span class='lb-rank ${i===0?"r1":(i===1?"r2":(i===2?"r3":""))}'>${medal}</span>
      <span class='lb-name'>${esc(r.name)}</span>
      <span class='lb-lvl'>最高${r.maxLevel}级</span>
      <span class='lb-score'>${r.score}</span>
      ${r.win?"<span class='lb-win'>👑</span>":""}
    </div>`;
  });
  box.innerHTML=html;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function openOver(){
  document.getElementById("overScoreNum").textContent=S.score;
  document.getElementById("overBestNum").textContent=S.best;
  document.getElementById("overName").value=myName;
  renderOverLB();
  document.getElementById("overOverlay").classList.add("show");
}
function closeOver(){ document.getElementById("overOverlay").classList.remove("show"); }
function renderOverLB(){   // 游戏结束面板内嵌排行榜：昵称 | 分数，10 位
  const box=document.getElementById("overLb");
  let html="<div class='ov-head'><span>昵称</span><span>分数</span></div>";
  if(lb.length===0){ html+="<div class='ov-row'><span class='ov-name'>暂无记录</span><span class='ov-score'>-</span></div>"; }
  else lb.slice(0,10).forEach((r,i)=>{
    const cur=r===S.curRec;
    html+=`<div class='ov-row${cur?" ov-cur":""}'><span class='ov-name'>${(i+1)}. ${esc(r.name)}</span><span class='ov-score'>${r.score}</span></div>`;
  });
  box.innerHTML=html;
}
function onOverNameInput(){
  myName=document.getElementById("overName").value.trim()||"勤劳的园丁";
  if(S.curRec){ S.curRec.name=myName; try{ localStorage.setItem("suikaLB2", JSON.stringify(lb)); }catch(e){} renderOverLB(); }
  try{ localStorage.setItem("suikaName", myName); }catch(e){}
}
let toastTimer=null;
function showToast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity=0,2600); }

/* ---------- 输入 ---------- */
function toWorld(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*CFG.W, y:(e.clientY-r.top)/r.height*CFG.H }; }
cv.addEventListener("pointermove",e=>{ if(S.mode==="playing"&&aim.active){ aim.x=clampX(toWorld(e).x); } });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); audio();
  if(S.mode==="playing"){ aim.x=clampX(toWorld(e).x); drop(); } });
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){keyL=true;} if(e.key==="ArrowRight"){keyR=true;}
  if(e.key===" "||e.key==="ArrowDown"||e.key==="Enter"){ e.preventDefault(); if(S.mode==="playing")drop(); }
});
window.addEventListener("keyup",e=>{ if(e.key==="ArrowLeft")keyL=false; if(e.key==="ArrowRight")keyR=false; });

function clampX(x){ const r=rOf(11); return Math.min(CFG.wallR-r, Math.max(CFG.wallL+r, x)); }
function pickLevel(){
  if(advanced){
    // 职级大作战1.0 高级阶段：主要掉 8~10，少量 5~7
    const w=[8,8,8,8,9,9,9,9,10,10,10,10,5,6,7];
    return w[Math.floor(Math.random()*w.length)];
  }
  const w=[11,11,11,11,12,12,12,13,13]; return w[Math.floor(Math.random()*w.length)];
}

/* ---------- 初始化 ---------- */
function startGame(){
  fruits=[]; parts=[]; pops=[];
  S.score=0; S.mode="playing"; S.won=false; S.celebrating=false; S.maxLevel=13; S.drops=0; S.saved=false; S.curRec=null; shake=0; dangerFlash=0;
  advanced=false;                        // 职级大作战1.0：新一局重置高级阶段，默认只掉初级球(11~13级)
  queue=[pickLevel(),pickLevel(),pickLevel()];
  aim={x:CFG.W/2,active:true};
  document.getElementById("menuBtns").classList.remove("show");
  closeOver();
  hideWin();
}
function winGame(x,y){
  if(S.won) return;
  S.won=true;
  S.celebrating=true;                 // 弹出庆祝，暂停游戏，点击后继续
  sfxWin();
  if(S.score>S.best){ S.best=S.score; try{localStorage.setItem("suikaBest2",String(S.best));}catch(e){} }
  document.getElementById("winScoreNum").textContent=S.score;
  document.getElementById("winBestNum").textContent=S.best;
  document.getElementById("winOverlay").classList.add("show");
}
function hideWin(){ document.getElementById("winOverlay").classList.remove("show"); S.celebrating=false; }
function drop(){
  if(!aim.active) return;
  const lvl=queue.shift();
  const f={level:lvl,x:aim.x,y:CFG.ceilY+4,vx:0,vy:40,r:rOf(lvl),spawnGuard:1.0};
  fruits.push(f);
  queue.push(pickLevel());
  S.drops++;
  sfxDrop();
  aim.active=true;
}

/* ---------- 物理 ---------- */
function step(dt,now){
  dt=Math.min(0.033,dt);
  if(S.celebrating) return;              // 一级庆祝时暂停游戏
  if(S.mode!=="playing"&&S.mode!=="over"&&S.mode!=="win") return;
  const ksp=340*dt;
  if(keyL) aim.x=clampX(aim.x-ksp);
  if(keyR) aim.x=clampX(aim.x+ksp);

  const damp=Math.max(0,1-CFG.airFric*dt);
  for(const f of fruits){
    f.vy=Math.min(CFG.maxV,f.vy+CFG.G*dt);
    f.vx*=damp; f.vy*=damp;
    f.x+=f.vx*dt; f.y+=f.vy*dt;
    if(f.spawnGuard!==undefined&&f.spawnGuard>0) f.spawnGuard-=dt;
  }

  mergeCheck(now);

  for(let it=0;it<CFG.solveIters;it++){
    for(let i=0;i<fruits.length;i++){
      const a=fruits[i];
      for(let j=i+1;j<fruits.length;j++){
        const b=fruits[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d>0.0001){
          const minD=a.r+b.r;
          if(d<minD){
            dx/=d; dy/=d;
            const push=(minD-d)*0.5;
            a.x-=dx*push; a.y-=dy*push;
            b.x+=dx*push; b.y+=dy*push;
            const vrel=(b.vx-a.vx)*dx+(b.vy-a.vy)*dy;
            if(vrel<0){ const imp=-vrel*(1+CFG.rest)*0.5; a.vx-=dx*imp; a.vy-=dy*imp; b.vx+=dx*imp; b.vy+=dy*imp; }
          }
        }
      }
    }
    for(const f of fruits){
      if(f.x-f.r<CFG.wallL){ f.x=CFG.wallL+f.r; if(f.vx<0)f.vx=-f.vx*CFG.rest; }
      if(f.x+f.r>CFG.wallR){ f.x=CFG.wallR-f.r; if(f.vx>0)f.vx=-f.vx*CFG.rest; }
      if(f.y+f.r>CFG.floorY){ f.y=CFG.floorY-f.r; if(f.vy>0)f.vy=-f.vy*CFG.rest; f.vx*=0.97; }
    }
  }

  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=500*dt; p.life-=dt*2.5; if(p.life<=0)parts.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t-=dt; if(pops[i].t<=0)pops.splice(i,1); }
  if(shake>0) shake-=dt*30;
  if(dangerFlash>0) dangerFlash-=dt*1.5;

  if(S.mode==="playing"){
    let over=false;
    for(const f of fruits){
      const speed=Math.abs(f.vx)+Math.abs(f.vy);
      if(f.spawnGuard<=0 && speed<60 && (f.y-f.r)<CFG.ceilY-3){ over=true; break; }
    }
    if(over){ S.mode="over"; if(S.score>S.best){S.best=S.score; try{localStorage.setItem("suikaBest2",String(S.best));}catch(e){}} sfxOver(); shake=1.2; dangerFlash=1.4; saveRecord(); openOver(); }
  }
}

function mergeCheck(now){
  const used=new Set();
  for(let i=0;i<fruits.length;i++){
    const a=fruits[i]; if(used.has(i)) continue;
    for(let j=i+1;j<fruits.length;j++){
      const b=fruits[j]; if(used.has(j)) continue;
      if(a.level!==b.level || a.level===1) continue;   // 一级球为独立个体，与其他一级球相撞不合并
      const dx=b.x-a.x, dy=b.y-a.y;
      if(dx*dx+dy*dy < (a.r+b.r)*(a.r+b.r)*CFG.mergeDistK*CFG.mergeDistK){
        const nx=(a.x+b.x)/2, ny=(a.y+b.y)/2, nvx=(a.vx+b.vx)/2, nvy=(a.vy+b.vy)/2;
        const nl=a.level-1;                       // 合成更大一级（数字变小）
        if(nl===4 && !advanced){ enterAdvanced(nx,ny); }   // 职级大作战1.0：合成到4级进入高级阶段，清初级球
        fruits.push({level:nl,x:nx,y:ny,vx:nvx,vy:nvy,r:rOf(nl),spawnGuard:0.5});
        used.add(i); used.add(j);
        S.score+=pts(nl);
        if(nl<S.maxLevel) S.maxLevel=nl;
        if(nl===1){ winGame(nx,ny); burst(nx,ny,40,"#ffd75e",340); shake=Math.max(shake,0.7); } // 合成一级球 → 获胜！
        else { burst(nx,ny,14,COLS[nl],200); if(nl<=4){ sfxBig(); shake=Math.max(shake,0.5); } else sfxMerge(); }
        pops.push({x:nx,y:ny-6,text:"+"+pts(nl),t:0.9,l:nl});
        break;
      }
    }
  }
  if(used.size>0){ const rem=[...used].sort((x,y)=>y-x); for(const idx of rem) fruits.splice(idx,1); }
}

/* 职级大作战1.0：合成到正高级(4级)后，清除场内所有初级球(11~13级)，新球只掉中级/副高级(5~10级) */
function enterAdvanced(x,y){
  advanced=true;
  let cleared=0, bonus=0;
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    if(f.level>=11 && f.level<=13){
      burst(f.x,f.y,16,COLS[f.level],240);   // 碎裂光效
      cleared++; bonus+=8;                   // 每球少量加分
      fruits.splice(i,1);
    }
  }
  for(let q=0;q<queue.length;q++){ if(queue[q]>=11) queue[q]=pickLevel(); }  // 排队中的初级球也换成高级球
  if(cleared>0){
    S.score+=bonus;
    sfxBig(); shake=Math.max(shake,0.6);
    pops.push({x:CFG.W/2,y:CFG.ceilY+30,text:"晋级正高级！初级球已清除 +"+bonus,t:1.9,l:2});
  } else {
    pops.push({x:CFG.W/2,y:CFG.ceilY+30,text:"晋级正高级！掉落已升级",t:1.6,l:2});
  }
}

function burst(x,y,n,col,spd){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=(0.3+Math.random())*spd;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.3,life:1,col:col,r:2+Math.random()*3}); } }

/* ---------- 渲染 ---------- */
function render(){
  ctx.clearRect(0,0,CFG.W,CFG.H);
  ctx.save();
  if(shake>0){ const m=shake*7; ctx.translate((Math.random()-0.5)*m,(Math.random()-0.5)*m); }

  const bg=ctx.createLinearGradient(0,0,0,CFG.H);
  bg.addColorStop(0,"#3b4a7a"); bg.addColorStop(1,"#232b4d");
  ctx.fillStyle=bg; ctx.fillRect(0,0,CFG.W,CFG.H);

  // HUD
  ctx.fillStyle="#fff"; ctx.font="700 28px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("职级大作战！",CFG.W/2,40);
  ctx.font="600 16px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillStyle="#ffd75e"; ctx.fillText("得分 "+S.score,CFG.W/2,70);
  ctx.fillStyle="rgba(255,255,255,.8)"; ctx.fillText("最佳 "+S.best,CFG.W/2,96);
  ctx.fillStyle="#ffd75e"; ctx.font="600 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
  let hudY=122;
  if(advanced){ ctx.fillText("已晋级正高级 · 掉落中级/副高级球",CFG.W/2,hudY); }

  // 下一个预览（左上角，避开居中标题）
  if(queue.length>0){
    const ql=queue[0];
    drawFruit(58,40,ql,rOf(ql)*0.6,false);
    ctx.fillStyle="rgba(255,255,255,.75)"; ctx.font="500 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("下一个 Lv"+ql,58,72);
  }

  // 容器
  const cx0=CFG.wallL-10, cy0=CFG.ceilY-14, cw=CFG.wallR-CFG.wallL+20, ch=CFG.floorY-CFG.ceilY+14;
  ctx.fillStyle="rgba(255,255,255,.06)"; ctx.fillRect(cx0,cy0,cw,ch);
  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=6; ctx.strokeRect(cx0,cy0,cw,ch);
  ctx.strokeStyle=dangerFlash>0?"rgba(255,80,60,"+Math.min(1,dangerFlash)+")":"rgba(255,120,90,.15)";
  ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(cx0,CFG.ceilY); ctx.lineTo(cx0+cw,CFG.ceilY); ctx.stroke(); ctx.setLineDash([]);

  // 瞄准
  if(S.mode==="playing"&&aim.active){
    const ql=queue[0], ar=rOf(ql);
    ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=2; ctx.setLineDash([4,8]);
    ctx.beginPath(); ctx.moveTo(aim.x,CFG.ceilY-8); ctx.lineTo(aim.x,CFG.floorY); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=0.55; drawFruit(aim.x,CFG.ceilY+2,ql,ar,true); ctx.globalAlpha=1;
  }

  const order=[...fruits].sort((a,b)=>(a.y-a.r)-(b.y-b.r));
  for(const f of order){ if(f.level===1) drawGlow(f.x,f.y,f.r); drawFruit(f.x,f.y,f.level,f.r,true); }

  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;

  for(const pp of pops){ ctx.globalAlpha=Math.min(1,pp.t); ctx.fillStyle="#fff";
    ctx.font="700 "+(15+pp.l*3)+"px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"; ctx.textAlign="center";
    ctx.fillText(pp.text,pp.x,pp.y-(1-pp.t)*34); }
  ctx.globalAlpha=1;

  ctx.restore();
  if(dangerFlash>0){ ctx.fillStyle="rgba(255,70,60,"+(dangerFlash*0.25)+")"; ctx.fillRect(0,0,CFG.W,CFG.H); }
  if(S.mode==="ready") drawMenu();
  else if(S.mode==="over"){ /* 结束面板由 DOM overOverlay 呈现 */ }
}

function drawFruit(x,y,lvl,r,face){
  const c=COLS[lvl];
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);
  g.addColorStop(0,lighten(c,55)); g.addColorStop(1,c);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.stroke();
  // 等级越高（越低级数字）加光圈区分四大级
  if(lvl<=4){ ctx.strokeStyle="rgba(255,215,120,.75)"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,r+2,0,6.28); ctx.stroke(); }
  else if(lvl<=7){ ctx.strokeStyle="rgba(220,235,255,.5)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r+2,0,6.28); ctx.stroke(); }
  // 高光
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.ellipse(x-r*0.3,y-r*0.4,r*0.22,r*0.14,-0.6,0,6.28); ctx.fill();
  if(lvl<=2){ // 顶级加个小王冠
    ctx.fillStyle="#ffd75e"; ctx.beginPath();
    ctx.moveTo(x-r*0.28,y-r); ctx.lineTo(x-r*0.28,y-r-6); ctx.lineTo(x-r*0.14,y-r-3);
    ctx.lineTo(x,y-r-7); ctx.lineTo(x+r*0.14,y-r-3); ctx.lineTo(x+r*0.28,y-r-6); ctx.lineTo(x+r*0.28,y-r);
    ctx.closePath(); ctx.fill();
  }
  if(face){
    const fs=Math.max(9,r*0.5);
    ctx.font="800 "+fs+"px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineJoin="round";
    ctx.lineWidth=Math.max(2,fs*0.18); ctx.strokeStyle="rgba(0,0,0,.4)";
    ctx.strokeText(lvl+"级",x,y);
    ctx.fillStyle="#fff"; ctx.fillText(lvl+"级",x,y);
  }
}
function drawGlow(x,y,r){   // 一级球脉动光晕
  const pulse=0.75+0.25*Math.sin(performance.now()/170);
  const g=ctx.createRadialGradient(x,y,r*0.5,x,y,r*2.6);
  g.addColorStop(0,"rgba(255,215,90,"+(0.6*pulse).toFixed(3)+")");
  g.addColorStop(0.5,"rgba(255,180,50,"+(0.3*pulse).toFixed(3)+")");
  g.addColorStop(1,"rgba(255,150,30,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.6,0,6.28); ctx.fill();
}
function lighten(hex,am){ const n=parseInt(hex.slice(1),16); const r=Math.min(255,(n>>16)+am),g=Math.min(255,((n>>8)&255)+am),b=Math.min(255,(n&255)+am);
  return "rgb("+r+","+g+","+b+")"; }

function panel(x,y,w,h){ ctx.fillStyle="rgba(20,25,46,.9)"; ctx.beginPath(); ctx.roundRect(x,y,w,h,18); ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=2; ctx.stroke(); }
function t(str,x,y,size,col,w){ ctx.fillStyle=col; ctx.font=w+" "+size+"px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(str,x,y); }
function drawMenu(){
  ctx.fillStyle="rgba(12,15,30,.6)"; ctx.fillRect(0,0,CFG.W,CFG.H);
  panel(40,168,360,452);
  t("职级大作战！",CFG.W/2,212,32,"#ffd75e",800);
  t("两个同色球碰撞，合成更大一级",CFG.W/2,252,15,"rgba(255,255,255,.9)",500);
  t("1级最大 · 13级最小 · 分四大等",CFG.W/2,278,14,"#b9f5a0",600);
  // 四大等代表球预览
  const reps=[[1,"正高级",35.5],[7,"副高级",28.4],[10,"中级",20],[13,"初级",15.4]];
  for(let i=0;i<reps.length;i++){ const x=CFG.W/2-135+i*90; const l=reps[i][0]; const rr=reps[i][2];
    ctx.save(); ctx.translate(x,332); drawFruit(0,0,l,rr,true); ctx.restore();
    t(reps[i][1],x,376,11,l<=4?"#ffd75e":(l<=7?"#bfe0ff":"rgba(255,255,255,.75)"),600);
  }
  document.getElementById("menuBtns").classList.add("show");
  const mb=document.getElementById("menuBest"); if(mb){ mb.textContent="最佳 "+S.best+" 分"; }
}

/* ---------- 右侧图例：颜色 ↔ 等级 ↔ 四大级 ---------- */
function buildLegend(){
  const box=document.getElementById("legendBody");
  let html="";
  for(const t of TIERS){
    html+=`<div class='lg-tier ${t.cls}'><span class='lg-tiername'>${t.name}</span><span class='lg-tiersize'>${t.size}球 · Lv${t.from}~${t.to}</span></div>`;
    for(let l=t.from;l<=t.to;l++){
      const r=6+(13-l)*0.9;
      html+=`<div class='lg-row'><span class='lg-ball' style='width:${(r*2).toFixed(1)}px;height:${(r*2).toFixed(1)}px;background:radial-gradient(circle at 35% 30%, ${lighten(COLS[l],60)}, ${COLS[l]});'></span><span class='lg-lv'>Lv ${l}</span></div>`;
    }
  }
  box.innerHTML=html;
}
buildLegend();

/* ---------- 主循环 ---------- */
let prev=0;
function loop(now){ const dt=prev?(now-prev)/1000:0.016; prev=now; step(dt,now); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
